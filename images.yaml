    context: "metaphlan/4.2.3"
    package: "metaphlan"

  metaphlan-424:
    repository: "metaphlan"
    version: "4.2.4"
    revision: 1
    aliases: ["4.2.4"]
    context: "metaphlan/4.2.4"
    package: "metaphlan"

  metaphlan-425:
    repository: "metaphlan"
    version: "4.2.5"
    revision: 1
    aliases: ["4.2.5"]
    context: "metaphlan/4.2.5"
    package: "metaphlan"

  metaphlan-426:
    repository: "metaphlan"
    version: "4.2.6"
    revision: 1
    context: "metaphlan/4.2.6"
    aliases: ["4.2", "4", "4.2.6", "latest"]
    package: "metaphlan"

  humann-3:
    repository: "humann"
    version: "3.7"
    revision: 1
    context: "humann/3.7.0"
