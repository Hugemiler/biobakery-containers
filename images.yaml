##############################################
# VKCLab-BioBakery canonical image inventory #
##############################################
# Author(s): Guilherme Fahur Bottino, Ph.D.
#
# Each entry has its own Dockerfile at context/Dockerfile.
# version is the primary software version (optional); revision is OUR image build revision.
# tag_base overrides the stem of the canonical <stem>-r<revision> tag.
# push_ghcr defaults to true; push_aws defaults to false; save defaults to false.
# No nested YAML; values use JSON-compatible syntax for the stdlib parser (by design).

